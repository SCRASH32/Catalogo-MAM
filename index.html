<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Catálogo de productos</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            color: #222;
        }


        /* =========================
           ENCABEZADO
        ========================= */

        header {
            background: #d71920;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }


        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }


        header p {
            font-size: 16px;
        }


        /* =========================
           PESTAÑAS
        ========================= */

        .pestanas {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 20px 15px;
            flex-wrap: wrap;
        }


        .pestana {
            border: none;

            padding: 13px 25px;

            border-radius: 30px;

            background: white;
            color: #333;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,.12);

            transition: .25s;
        }


        .pestana:hover {
            transform: translateY(-2px);
        }


        .pestana.activa {
            background: #d71920;
            color: white;
        }


        /* =========================
           BOTÓN OFERTAS
        ========================= */

        .pestana.ofertas {
            background:
                linear-gradient(
                    135deg,
                    #ffcc00,
                    #ff6a00
                );

            color: #8b0000;

            border: 2px solid white;

            animation:
                pulsar 1.5s infinite;
        }


        .pestana.ofertas.activa {
            background:
                linear-gradient(
                    135deg,
                    #ff0000,
                    #ff9800
                );

            color: white;
        }


        @keyframes pulsar {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }

        }


        /* =========================
           BUSCADOR
        ========================= */

        .buscador {
            max-width: 500px;

            margin: 0 auto 25px;

            padding: 0 15px;
        }


        .buscador input {
            width: 100%;

            padding: 14px 18px;

            border:
                1px solid #ddd;

            border-radius: 30px;

            font-size: 16px;

            outline: none;
        }


        .buscador input:focus {
            border-color: #d71920;
        }


        /* =========================
           GALERÍA
        ========================= */

        .galeria {

            max-width: 1200px;

            margin: auto;

            padding:
                10px 15px 50px;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }


        .producto {

            position: relative;

            background: white;

            border-radius: 12px;

            overflow: hidden;

            cursor: pointer;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,.10);

            transition:
                transform .25s,
                box-shadow .25s;
        }


        .producto:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 8px 20px
                rgba(0,0,0,.18);
        }


        .producto img {

            width: 100%;

            height: 230px;

            display: block;

            object-fit: contain;

            padding: 10px;

            background: white;
        }


        /* =========================
           CINTA OFERTA
        ========================= */

        .etiqueta-oferta {

            position: absolute;

            top: 12px;
            left: 12px;

            z-index: 2;

            background:
                linear-gradient(
                    135deg,
                    #ff0000,
                    #ff7200
                );

            color: white;

            padding: 8px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            box-shadow:
                0 3px 8px
                rgba(0,0,0,.3);

            animation:
                oferta 1.3s infinite;
        }


        @keyframes oferta {

            0% {
                transform:
                    rotate(-3deg)
                    scale(1);
            }

            50% {
                transform:
                    rotate(3deg)
                    scale(1.08);
            }

            100% {
                transform:
                    rotate(-3deg)
                    scale(1);
            }

        }


        /* =========================
           INFORMACIÓN OFERTA
        ========================= */

        .info-oferta {

            padding: 15px;

            text-align: center;
        }


        .nombre-oferta {

            font-size: 19px;

            font-weight: bold;

            color: #333;

            margin-bottom: 12px;
        }


        .promocion {

            background:
                #fff4d6;

            border:
                2px solid #ff9800;

            border-radius: 9px;

            padding: 9px;

            margin-top: 7px;

            font-weight: bold;

            color: #d71920;
        }


        /* =========================
           MENSAJE DE CARGA
        ========================= */

        .cargando {

            grid-column: 1 / -1;

            text-align: center;

            padding: 50px;

            font-size: 20px;

            color: #777;
        }


        /* =========================
           ERROR
        ========================= */

        .error-ofertas {

            grid-column: 1 / -1;

            background: white;

            border-radius: 15px;

            padding: 30px;

            text-align: center;

            color: #d71920;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,.1);
        }


        /* =========================
           VISOR
        ========================= */

        .visor {

            display: none;

            position: fixed;

            z-index: 9999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0,0,0,.92);

            align-items: center;

            justify-content: center;
        }


        .visor img {

            max-width: 90%;
            max-height: 90%;

            object-fit: contain;

            border-radius: 8px;
        }


        /* =========================
           CERRAR
        ========================= */

        .cerrar {

            position: absolute;

            top: 20px;
            right: 30px;

            color: white;

            font-size: 45px;

            font-weight: bold;

            cursor: pointer;

            z-index: 10001;
        }


        .cerrar:hover {
            color: #ff4444;
        }


        /* =========================
           BOTONES VISOR
        ========================= */

        .anterior,
        .siguiente {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background:
                rgba(255,255,255,.2);

            color: white;

            width: 55px;
            height: 70px;

            font-size: 35px;

            cursor: pointer;

            border-radius: 8px;
        }


        .anterior {
            left: 20px;
        }


        .siguiente {
            right: 20px;
        }


        .anterior:hover,
        .siguiente:hover {

            background:
                rgba(255,255,255,.4);
        }


        /* =========================
           NUMERO
        ========================= */

        .numero {

            position: absolute;

            bottom: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            color: white;

            background:
                rgba(0,0,0,.5);

            padding: 8px 15px;

            border-radius: 20px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .galeria {
                grid-template-columns:
                    repeat(3,1fr);
            }

        }


        @media (max-width: 650px) {

            header h1 {
                font-size: 26px;
            }


            .pestana {

                padding:
                    11px 16px;

                font-size: 14px;
            }


            .galeria {

                grid-template-columns:
                    repeat(2,1fr);

                gap: 12px;
            }


            .producto img {
                height: 180px;
            }


            .anterior,
            .siguiente {

                width: 45px;

                height: 60px;

                font-size: 28px;
            }


            .anterior {
                left: 8px;
            }


            .siguiente {
                right: 8px;
            }

        }


        @media (max-width: 400px) {

            .producto img {
                height: 150px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         ENCABEZADO
    ========================= -->

    <header>

        <h1>
            CATÁLOGO
        </h1>

        <p>
            Todos nuestros productos
        </p>

    </header>


    <!-- =========================
         PESTAÑAS
    ========================= -->

    <div class="pestanas">

        <button
            class="pestana activa"
            id="btnTodos"
            onclick="mostrarTodos()">

            🛍️ TODOS

        </button>


        <button
            class="pestana ofertas"
            id="btnOfertas"
            onclick="mostrarOfertas()">

            🔥 OFERTAS DE LA SEMANA 🔥

        </button>

    </div>


    <!-- =========================
         BUSCADOR
    ========================= -->

    <div class="buscador">

        <input
            type="text"
            id="buscar"
            placeholder="🔍 Buscar producto..."
            oninput="buscarProducto()">

    </div>


    <!-- =========================
         GALERÍA
    ========================= -->

    <div
        class="galeria"
        id="galeria">

    </div>


    <!-- =========================
         VISOR
    ========================= -->

    <div
        class="visor"
        id="visor">


        <span
            class="cerrar"
            onclick="cerrarVisor()">

            &times;

        </span>


        <button
            class="anterior"
            onclick="imagenAnterior()">

            &#10094;

        </button>


        <img
            id="imagenGrande"
            src=""
            alt="Producto">


        <button
            class="siguiente"
            onclick="imagenSiguiente()">

            &#10095;

        </button>


        <div
            class="numero"
            id="numeroImagen">

            1 / 52

        </div>

    </div>


    <script>


        /* =========================
           CONFIGURACIÓN
        ========================= */

        const TOTAL_IMAGENES = 52;


        let imagenActual = 1;


        let modoOfertas = false;


        let ofertasCargadas = [];


        /* =========================
           ELEMENTOS
        ========================= */

        const galeria =
            document.getElementById(
                "galeria"
            );


        const visor =
            document.getElementById(
                "visor"
            );


        const imagenGrande =
            document.getElementById(
                "imagenGrande"
            );


        const numeroImagen =
            document.getElementById(
                "numeroImagen"
            );


        const buscador =
            document.getElementById(
                "buscar"
            );


        const btnTodos =
            document.getElementById(
                "btnTodos"
            );


        const btnOfertas =
            document.getElementById(
                "btnOfertas"
            );


        /* =========================
           MOSTRAR TODOS
        ========================= */

        function mostrarTodos() {

            modoOfertas = false;

            buscador.value = "";

            btnTodos.classList.add(
                "activa"
            );

            btnOfertas.classList.remove(
                "activa"
            );

            mostrarImagenes();

        }


        /* =========================
           MOSTRAR PRODUCTOS
        ========================= */

        function mostrarImagenes() {

            galeria.innerHTML = "";


            for (
                let i = 1;
                i <= TOTAL_IMAGENES;
                i++
            ) {

                const producto =
                    document.createElement(
                        "div"
                    );


                producto.className =
                    "producto";


                producto.dataset.numero =
                    i;


                producto.innerHTML = `

                    <img
                        src="${i}.png"
                        alt="Producto ${i}"
                        loading="lazy"
                    >

                `;


                producto.onclick =
                    function() {

                        abrirVisor(i);

                    };


                const imagen =
                    producto.querySelector(
                        "img"
                    );


                imagen.onerror =
                    function() {

                        producto.style.display =
                            "none";

                    };


                galeria.appendChild(
                    producto
                );

            }

        }


        /* =========================
           CARGAR OFERTAS.TXT
        ========================= */

        async function mostrarOfertas() {

            modoOfertas = true;

            buscador.value = "";

            btnTodos.classList.remove(
                "activa"
            );

            btnOfertas.classList.add(
                "activa"
            );


            galeria.innerHTML = `

                <div class="cargando">

                    ⏳ Cargando ofertas...

                </div>

            `;


            try {

                const respuesta =
                    await fetch(
                        "ofertas.txt?actualizado=" +
                        Date.now()
                    );


                if (!respuesta.ok) {

                    throw new Error(
                        "No se pudo abrir ofertas.txt"
                    );

                }


                const texto =
                    await respuesta.text();


                ofertasCargadas =
                    procesarOfertas(texto);


                mostrarTarjetasOfertas();


            } catch (error) {

                galeria.innerHTML = `

                    <div class="error-ofertas">

                        <h2>
                            ⚠️ No se pudieron cargar
                            las ofertas
                        </h2>

                        <br>

                        <p>
                            Verificá que el archivo
                            <strong>ofertas.txt</strong>
                            esté en la misma carpeta
                            que el archivo HTML.
                        </p>

                    </div>

                `;

            }

        }


        /* =========================
           PROCESAR TXT
        ========================= */

        function procesarOfertas(texto) {

            const lineas =
                texto.split("\n");


            const ofertas = [];


            lineas.forEach(linea => {

                linea =
                    linea.trim();


                if (!linea) {
                    return;
                }


                if (
                    linea.startsWith("#")
                ) {
                    return;
                }


                const partes =
                    linea.split("|");


                if (
                    partes.length < 3
                ) {
                    return;
                }


                const numero =
                    partes[0].trim();


                const nombre =
                    partes[1].trim();


                const promociones =
                    partes
                        .slice(2)
                        .map(
                            texto => texto.trim()
                        )
                        .filter(
                            texto => texto
                        );


                ofertas.push({

                    numero:
                        numero,

                    nombre:
                        nombre,

                    promociones:
                        promociones

                });

            });


            return ofertas;

        }


        /* =========================
           CREAR TARJETAS DE OFERTA
        ========================= */

        function mostrarTarjetasOfertas() {

            galeria.innerHTML = "";


            if (
                ofertasCargadas.length === 0
            ) {

                galeria.innerHTML = `

                    <div class="error-ofertas">

                        <h2>
                            📋 No hay ofertas
                        </h2>

                        <p>
                            Agregá las ofertas
                            de esta semana
                            en ofertas.txt
                        </p>

                    </div>

                `;

                return;

            }


            ofertasCargadas.forEach(
                oferta => {


                    const producto =
                        document.createElement(
                            "div"
                        );


                    producto.className =
                        "producto";


                    producto.dataset.numero =
                        oferta.numero;


                    let promocionesHTML =
                        "";


                    oferta.promociones
                        .forEach(
                            promocion => {

                                promocionesHTML += `

                                    <div
                                        class="promocion">

                                        🔥
                                        ${escapeHTML(
                                            promocion
                                        )}

                                    </div>

                                `;

                            }
                        );


                    producto.innerHTML = `

                        <div
                            class="etiqueta-oferta">

                            🔥 ¡ESTÁ EN OFERTA! 🔥

                        </div>


                        <img
                            src="${oferta.numero}.png"
                            alt="${escapeHTML(
                                oferta.nombre
                            )}"
                            loading="lazy"
                        >


                        <div
                            class="info-oferta">

                            <div
                                class="nombre-oferta">

                                ${escapeHTML(
                                    oferta.nombre
                                )}

                            </div>


                            ${promocionesHTML}

                        </div>

                    `;


                    producto.onclick =
                        function() {

                            abrirVisor(
                                Number(
                                    oferta.numero
                                )
                            );

                        };


                    const imagen =
                        producto.querySelector(
                            "img"
                        );


                    imagen.onerror =
                        function() {

                            producto.style.display =
                                "none";

                        };


                    galeria.appendChild(
                        producto
                    );

                }
            );

        }


        /* =========================
           BUSCADOR
        ========================= */

        function buscarProducto() {

            const texto =
                buscador.value
                    .toLowerCase()
                    .trim();


            if (modoOfertas) {

                const filtradas =
                    ofertasCargadas.filter(
                        oferta =>

                            oferta.numero
                                .toLowerCase()
                                .includes(texto)

                            ||

                            oferta.nombre
                                .toLowerCase()
                                .includes(texto)

                            ||

                            oferta.promociones
                                .join(" ")
                                .toLowerCase()
                                .includes(texto)
                    );


                mostrarOfertasFiltradas(
                    filtradas
                );


                return;

            }


            const productos =
                document.querySelectorAll(
                    ".producto"
                );


            productos.forEach(
                producto => {

                    const numero =
                        producto.dataset.numero;


                    if (
                        numero.includes(texto)
                    ) {

                        producto.style.display =
                            "block";

                    } else {

                        producto.style.display =
                            "none";

                    }

                }
            );

        }


        /* =========================
           OFERTAS FILTRADAS
        ========================= */

        function mostrarOfertasFiltradas(
            ofertas
        ) {

            galeria.innerHTML = "";


            ofertas.forEach(
                oferta => {

                    const producto =
                        document.createElement(
                            "div"
                        );


                    producto.className =
                        "producto";


                    let promocionesHTML =
                        "";


                    oferta.promociones
                        .forEach(
                            promocion => {

                                promocionesHTML += `

                                    <div
                                        class="promocion">

                                        🔥
                                        ${escapeHTML(
                                            promocion
                                        )}

                                    </div>

                                `;

                            }
                        );


                    producto.innerHTML = `

                        <div
                            class="etiqueta-oferta">

                            🔥 ¡ESTÁ EN OFERTA! 🔥

                        </div>


                        <img
                            src="${oferta.numero}.png"
                            alt="${escapeHTML(
                                oferta.nombre
                            )}"
                        >


                        <div
                            class="info-oferta">

                            <div
                                class="nombre-oferta">

                                ${escapeHTML(
                                    oferta.nombre
                                )}

                            </div>

                            ${promocionesHTML}

                        </div>

                    `;


                    producto.onclick =
                        function() {

                            abrirVisor(
                                Number(
                                    oferta.numero
                                )
                            );

                        };


                    galeria.appendChild(
                        producto
                    );

                }
            );

        }


        /* =========================
           SEGURIDAD HTML
        ========================= */

        function escapeHTML(texto) {

            return texto
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================
           VISOR
        ========================= */

        function abrirVisor(numero) {

            imagenActual =
                numero;


            actualizarVisor();


            visor.style.display =
                "flex";


            document.body.style.overflow =
                "hidden";

        }


        function actualizarVisor() {

            imagenGrande.src =
                imagenActual + ".png";


            imagenGrande.alt =
                "Producto " +
                imagenActual;


            numeroImagen.textContent =
                imagenActual +
                " / " +
                TOTAL_IMAGENES;

        }


        function cerrarVisor() {

            visor.style.display =
                "none";


            document.body.style.overflow =
                "auto";

        }


        /* =========================
           ANTERIOR
        ========================= */

        function imagenAnterior() {

            imagenActual--;


            if (
                imagenActual < 1
            ) {

                imagenActual =
                    TOTAL_IMAGENES;

            }


            actualizarVisor();

        }


        /* =========================
           SIGUIENTE
        ========================= */

        function imagenSiguiente() {

            imagenActual++;


            if (
                imagenActual >
                TOTAL_IMAGENES
            ) {

                imagenActual = 1;

            }


            actualizarVisor();

        }


        /* =========================
           CLICK AFUERA
        ========================= */

        visor.addEventListener(
            "click",
            function(event) {

                if (
                    event.target === visor
                ) {

                    cerrarVisor();

                }

            }
        );


        /* =========================
           TECLADO
        ========================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    visor.style.display !==
                    "flex"
                ) {

                    return;

                }


                if (
                    event.key === "Escape"
                ) {

                    cerrarVisor();

                }


                if (
                    event.key === "ArrowLeft"
                ) {

                    imagenAnterior();

                }


                if (
                    event.key === "ArrowRight"
                ) {

                    imagenSiguiente();

                }

            }
        );


        /* =========================
           INICIAR
        ========================= */

        mostrarTodos();

    </script>

</body>

</html>
