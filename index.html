<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de productos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            color: #222;
        }

        /* ENCABEZADO */

        header {
            background: #d71920;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
        }

        /* BUSCADOR */

        .buscador {
            max-width: 500px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .buscador input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }

        .buscador input:focus {
            border-color: #d71920;
        }

        /* GALERÍA */

        .galeria {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 15px 50px;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .producto {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.10);
            transition: 0.25s;
        }

        .producto:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.18);
        }

        .producto img {
            width: 100%;
            height: 230px;
            display: block;
            object-fit: contain;
            padding: 10px;
            background: white;
        }

        /* VENTANA GRANDE */

        .visor {
            display: none;

            position: fixed;
            z-index: 9999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.92);

            align-items: center;
            justify-content: center;
        }

        .visor img {
            max-width: 90%;
            max-height: 90%;

            object-fit: contain;

            border-radius: 8px;

            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* BOTÓN CERRAR */

        .cerrar {
            position: absolute;

            top: 20px;
            right: 30px;

            color: white;

            font-size: 45px;
            font-weight: bold;

            cursor: pointer;

            z-index: 10001;
        }

        .cerrar:hover {
            color: #ff4444;
        }

        /* BOTONES ANTERIOR / SIGUIENTE */

        .anterior,
        .siguiente {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: rgba(255,255,255,0.2);

            color: white;

            width: 55px;
            height: 70px;

            font-size: 35px;

            cursor: pointer;

            border-radius: 8px;

            transition: 0.2s;
        }

        .anterior:hover,
        .siguiente:hover {
            background: rgba(255,255,255,0.4);
        }

        .anterior {
            left: 20px;
        }

        .siguiente {
            right: 20px;
        }

        /* NÚMERO DE IMAGEN */

        .numero {
            position: absolute;

            bottom: 20px;

            left: 50%;

            transform: translateX(-50%);

            color: white;

            background: rgba(0,0,0,0.5);

            padding: 8px 15px;

            border-radius: 20px;

            font-size: 15px;
        }

        /* SIN RESULTADOS */

        .sin-resultados {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #777;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {

            .galeria {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 650px) {

            header h1 {
                font-size: 26px;
            }

            .galeria {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .producto img {
                height: 180px;
            }

            .anterior,
            .siguiente {
                width: 45px;
                height: 60px;
                font-size: 28px;
            }

            .anterior {
                left: 8px;
            }

            .siguiente {
                right: 8px;
            }

        }

        @media (max-width: 400px) {

            .producto img {
                height: 150px;
            }

        }
    </style>
</head>

<body>

    <header>
        <h1>CATALOGO</h1>
        <p>Todos nuestros productos</p>
    </header>


    <div class="buscador">

    </div>


    <div class="galeria" id="galeria"></div>


    <!-- VISOR DE IMAGEN -->

    <div class="visor" id="visor">

        <span class="cerrar" onclick="cerrarVisor()">
            &times;
        </span>

        <button class="anterior" onclick="imagenAnterior()">
            &#10094;
        </button>

        <img id="imagenGrande" src="" alt="Producto">

        <button class="siguiente" onclick="imagenSiguiente()">
            &#10095;
        </button>

        <div class="numero" id="numeroImagen">
            1 / 50
        </div>

    </div>


    <script>

        const galeria = document.getElementById("galeria");

        const visor = document.getElementById("visor");

        const imagenGrande = document.getElementById("imagenGrande");

        const numeroImagen = document.getElementById("numeroImagen");

        let imagenActual = 1;


        /* CREAR LAS 50 IMÁGENES */

        function mostrarImagenes() {

            galeria.innerHTML = "";

            for (let i = 1; i <= 50; i++) {

                const producto = document.createElement("div");

                producto.className = "producto";

                producto.dataset.numero = i;

                producto.innerHTML = `
                    <img
                        src="imagenes/${i}.png"
                        alt="Producto ${i}"
                        loading="lazy"
                        onerror="this.parentElement.style.display='none'"
                    >
                `;

                producto.onclick = function() {
                    abrirVisor(i);
                };

                galeria.appendChild(producto);
            }
        }


        /* ABRIR IMAGEN */

        function abrirVisor(numero) {

            imagenActual = numero;

            actualizarVisor();

            visor.style.display = "flex";

            document.body.style.overflow = "hidden";
        }


        /* ACTUALIZAR VISOR */

        function actualizarVisor() {

            imagenGrande.src =
                "imagenes/" + imagenActual + ".png";

            imagenGrande.alt =
                "Producto " + imagenActual;

            numeroImagen.textContent =
                imagenActual + " / 50";
        }


        /* CERRAR */

        function cerrarVisor() {

            visor.style.display = "none";

            document.body.style.overflow = "auto";
        }


        /* ANTERIOR */

        function imagenAnterior() {

            imagenActual--;

            if (imagenActual < 1) {
                imagenActual = 50;
            }

            actualizarVisor();
        }


        /* SIGUIENTE */

        function imagenSiguiente() {

            imagenActual++;

            if (imagenActual > 50) {
                imagenActual = 1;
            }

            actualizarVisor();
        }


        /* BUSCAR */

        function buscar() {

            const texto =
                document.getElementById("buscar").value
                .toLowerCase()
                .trim();

            const productos =
                document.querySelectorAll(".producto");

            productos.forEach(producto => {

                const numero =
                    producto.dataset.numero;

                if (
                    numero.includes(texto) ||
                    texto === ""
                ) {
                    producto.style.display = "block";
                } else {
                    producto.style.display = "none";
                }

            });
        }


        /* CERRAR HACIENDO CLICK AFUERA */

        visor.addEventListener("click", function(event) {

            if (event.target === visor) {
                cerrarVisor();
            }

        });


        /* TECLADO */

        document.addEventListener("keydown", function(event) {

            if (visor.style.display !== "flex") {
                return;
            }

            if (event.key === "Escape") {
                cerrarVisor();
            }

            if (event.key === "ArrowLeft") {
                imagenAnterior();
            }

            if (event.key === "ArrowRight") {
                imagenSiguiente();
            }

        });


        /* CARGAR GALERÍA */

        mostrarImagenes();

    </script>

</body>
</html>
